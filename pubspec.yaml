name: ei_app
description: A personal accounting app with security.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.70.0
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  flutter_local_notifications: ^17.0.0   # ✅ درست
  timezone: ^0.9.4                       # ✅ اضافه شد

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: IranYekan
      fonts:
        - asset: assets/fonts/iranyekanwebregulart.woff
          weight: 400
        - asset: assets/fonts/iranyekanwebmedium.woff
          weight: 500
        - asset: assets/fonts/iranyekanwebbold.woff
          weight: 700
    - family: IranSans
      fonts:
        - asset: assets/fonts/iran-sans.woff2
          weight: 400
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700